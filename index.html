<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: Android 에서 키보드가 뜰 때 dvh 까지 같이 줄인다.
         기록 화면은 입력칸이 주인공이라 이게 없으면 칸이 키보드 밑에 깔린다.
         Fokus DE 에서 오래 고생한 문제 — 절대 지우지 말 것. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#101214" />
    <meta name="description" content="하루 20분, 내 하루를 독일어로 — B1→B2 6개월 프로그램." />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alltag" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;600;700&display=swap" />
    <title>Fokus Alltag</title>
    <script>
      // React 마운트 전에 테마를 <html> 에 반영 — 첫 페인트 깜빡임 방지.
      // ⚠ src/lib/theme.js 의 applyTheme 와 같아야 한다 (BAR 표 포함).
      (function () {
        var BAR = { light: "#f3ede2", dark: "#101214", paper: "#F5F5F3", neon: "#0B0E14",
                    forest: "#131313", lavender: "#1A1625", terminal: "#1a1a2e" };
        try {
          var s = JSON.parse(localStorage.getItem("fa-settings") || "{}");
          var t = s.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", BAR[t] || BAR.light);
        } catch (e) { /* 저장소를 못 읽으면 기본 라이트 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
